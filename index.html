<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">
    <title>Login Page</title>
</head>

<body>
    <main class="login-wrapper">
        <div class="login-card">

            <!-- Painel do Formulário -->
            <section class="form-container">
                <div class="form-content">
                    <h2 class="form-title">Nova conta</h2>

                    <form action="#" id="register-form" class="auth-form">
                        <div class="input-group">
                            <input type="text" name="name" id="name" class="form-input" placeholder="Nome completo"
                                required>
                        </div>

                        <div class="input-group">
                            <input type="email" name="email" id="email" class="form-input"
                                placeholder="Digite seu email" required>
                        </div>

                        <div class="input-group">
                            <input type="password" name="password" id="password" class="form-input"
                                placeholder="Digite sua senha" required>
                        </div>

                        <div class="terms-group">
                            <input type="checkbox" name="termos" id="terms" class="terms-checkbox">
                            <label for="terms" class="terms-label">Concordo com os termos.</label>
                        </div>

                        <button type="submit" id="btn-submit" class="btn-primary">Criar conta</button>
                    </form>

                    <p class="form-footer">
                        Já possui uma conta? <a href="login.html" class="link-secondary">Faça login.</a>
                    </p>
                </div>
            </section>

            <!-- Painel Visual / Apresentação -->
            <aside class="banner-section">
                <div class="banner-content">
                    <img src="/assets/222.png" alt="Ilustração de boas-vindas" class="banner-img">
                    
                    <h3 class="banner-title">Leve sua carreira ao <br> próximo nível.</h3>

                    <p class="banner-text">
                        Lorem ipsum dolor sit amet, consectetur <br>adipiscing elit. Egestas fermentum nibh volutpat
                        <br> turpis orci
                        pharetra euismod quam non.
                    </p>
                </div>

            </aside>

        </div>
    </main>
</body>

</html>
